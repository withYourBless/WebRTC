<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WebRTC Room</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input,
        button {
            padding: 10px;
            font-size: 16px;
        }

        .videos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        video {
            width: 100%;
            background: black;
            border-radius: 8px;
        }

        pre {
            background: #eee;
            padding: 15px;
            overflow-x: auto;
        }

        @media (max-width: 700px) {
            .videos {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<h1>WebRTC Room</h1>

<div class="controls">

    <input
        id="roomInput"
        value="test-room"
        placeholder="Room name"
    >

    <button id="joinButton">
        Join room
    </button>

    <button
        id="leaveButton"
        disabled
    >
        Leave
    </button>

    <button
        id="muteButton"
        disabled
    >
        Mute
    </button>

    <button
        id="cameraButton"
        disabled
    >
        Camera Off
    </button>

    <button
        id="shareScreenButton"
        disabled
    >
        Share Screen
    </button>

</div>


<p>
    Status:
    <strong id="status">
        disconnected
    </strong>
</p>


<div class="videos">

    <div>
        <h3>Local video</h3>

        <video
            id="localVideo"
            autoplay
            playsinline
            muted
        ></video>
    </div>


    <div>
        <h3>Remote video</h3>

        <video
            id="remoteVideo"
            autoplay
            playsinline
        ></video>
    </div>

</div>

<h3>WebRTC Chat</h3>

<div class="controls">

    <input
        id="messageInput"
        placeholder="Message"
        disabled
    >

    <button
        id="sendButton"
        disabled
    >
        Send
    </button>

</div>

<pre id="chatMessages">Waiting for DataChannel...</pre>

<h3>Debug</h3>

<pre id="debug"></pre>

<h3>ICE connection</h3>
<pre id="iceInfo">Waiting for connection...</pre>

<h3>WebRTC statistics</h3>
<pre id="statsInfo">Waiting for connection...</pre>


<script src="/static/client.js?v=audio-v1"></script>

</body>
</html>
